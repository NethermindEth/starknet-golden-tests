name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Check that corpora/ and recorded/ match tests/
        run: |
          go run ./cmd/migrate-tests
          # New, changed and removed files all show in git status.
          git status --porcelain -- corpora recorded | tee /dev/stderr | (! grep .)
      - run: go run ./cmd/corpus-diff validate corpora
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
